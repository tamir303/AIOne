name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must run before type-check/test: packages/*'s package.json
      # `exports` point at `./dist/*.js` (and dist/ is gitignored), so any
      # cross-package import (e.g. apps/web importing @aione/core) can't
      # resolve on a clean checkout until dist exists. pnpm -r respects
      # workspace dependency order, so this builds packages/* before the
      # apps/* that consume them.
      - name: Build
        run: pnpm -r build

      - name: Type check
        run: pnpm -r type-check

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test
